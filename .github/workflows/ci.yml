name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rinspace-tags-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: "1"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Module files
            command: |
              go mod tidy
              git diff --exit-code -- go.mod go.sum
          - name: Core tests
            command: go test -p 1 -count=1 ./core/...
          - name: Contract tests
            command: go test -p 1 -count=1 ./contracts/...
          - name: CLI tests
            command: go test -p 1 -count=1 ./cmd/...
          - name: Static analysis
            command: go vet -p 1 ./...
          - name: Build
            command: go build -p 1 ./...
          - name: Source boundary
            command: |
              workspace_pattern='/home''/ubuntu'
              private_module_pattern='rinspace/''server'
              if grep -R -n -E "${workspace_pattern}|${private_module_pattern}" --exclude-dir=.git .; then
                echo 'private workspace or module reference found' >&2
                exit 1
              fi
          - name: Synthetic graph
            command: go run ./cmd/rinspace-tagsctl validate -file examples/synthetic-knowledge-base/graph.json
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  go:
    name: go
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every named check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [ "${CHECKS_RESULT}" != 'success' ]; then
            echo '::error title=CI checks failed::Open the named failed check above for the exact failing category and log.'
            exit 1
          fi
          echo 'All named CI checks passed.'
